services:
  - type: static
    name: alfacomp-store
    buildCommand: npm ci --no-audit && NODE_OPTIONS="--max-old-space-size=4096" npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_SUPABASE_PROJECT_ID
        sync: false
      - key: VITE_GEMINI_API_KEY
        sync: false
      - key: VITE_GEMINI_MODEL
        sync: false
      - key: BOT_TOKEN
        sync: false
    routes:
      # Redirect /product/SLUG (no trailing slash) → /product/SLUG/ (301 permanent)
      # This fixes the main SEO issue: 181 pages not indexed because sitemap URLs
      # without slash hit the SPA fallback and serve the homepage HTML to Googlebot.
      - type: redirect
        source: /product/:slug
        destination: /product/:slug/
        statusCode: 301
      # Same for category pages
      - type: redirect
        source: /category/:cat
        destination: /category/:cat/
        statusCode: 301
      # SPA fallback — must come LAST
      - type: rewrite
        source: /*
        destination: /index.html
